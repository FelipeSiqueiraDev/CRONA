<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060a" />
    <title>CRONA</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/arte/marca/crona-icone-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/arte/marca/crona-icone-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/arte/marca/crona-icone-192.png" />
    <link rel="apple-touch-icon" href="/arte/marca/crona-icone-180.png" />
    <script>
      // o fundo da tela de entrada, adiantado só para quem vai vê-la (29/10: baixava em toda abertura, também para quem
      // já tem a conta guardada ou entra pela mesa, pelo link do mestre ou pela ficha)
      (function () {
        try {
          var q = location.search;
          if (/[?&](mesa|auto|mestre|ficha)\b/.test(q)) return;
          if (localStorage.getItem('crona.sessao') || localStorage.getItem('crona.gmKey') || localStorage.getItem('crona.fichaKey')) return;
        } catch (e) {}
        [['/arte/login/fundo-computador.webp', '(min-aspect-ratio: 17/20)'], ['/arte/login/fundo-celular.webp', '(max-aspect-ratio: 17/20)']].forEach(function (p) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = p[0];
          l.media = p[1];
          document.head.appendChild(l);
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=Special+Elite&family=Ubuntu+Mono:wght@400;700&family=Cinzel:wght@400;500;600&family=Roboto+Serif:opsz,wdth,wght@8..144,50..100,400..800&family=Roboto+Condensed:wght@400;500;700&family=Courier+Prime:wght@400;700&family=Caveat:wght@400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
